<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoTrack - Login</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #f5f7fa;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .login-wrapper {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo-icon {
    width: 64px;
    height: 64px;
    background-color: #1eb980;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
  }

  .logo-icon svg {
    width: 30px;
    height: 30px;
    stroke: #0e3d2c;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  h1.brand {
    font-size: 2.25rem;
    font-weight: 800;
    color: #0f7a4e;
    margin-bottom: 10px;
    letter-spacing: -0.5px;
  }

  .tagline {
    color: #6b7280;
    font-size: 0.95rem;
    text-align: center;
    line-height: 1.5;
    margin-bottom: 30px;
    max-width: 320px;
  }

  .login-card {
    width: 100%;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 32px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
  }

  .field {
    margin-bottom: 20px;
  }

  .field-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  label {
    font-size: 0.9rem;
    font-weight: 600;
    color: #374151;
  }

  .forgot-link {
    font-size: 0.85rem;
    color: #0f7a4e;
    text-decoration: none;
  }

  .forgot-link:hover {
    text-decoration: underline;
  }

  .input-group {
    position: relative;
    display: flex;
    align-items: center;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    padding: 0 14px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .input-group:focus-within {
    border-color: #1eb980;
    box-shadow: 0 0 0 3px rgba(30, 185, 128, 0.15);
  }

  .input-group svg {
    width: 18px;
    height: 18px;
    color: #6b7280;
    flex-shrink: 0;
  }

  .input-group input {
    border: none;
    outline: none;
    padding: 12px 10px;
    font-size: 0.95rem;
    width: 100%;
    color: #111827;
    background: transparent;
  }

  .input-group input::placeholder {
    color: #9ca3af;
  }

  .input-group.error {
    border-color: #dc2626;
  }

  .error-text {
    display: none;
    color: #dc2626;
    font-size: 0.8rem;
    margin-top: 6px;
  }

  .remember-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 24px;
  }

  .remember-row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: #1eb980;
    cursor: pointer;
  }

  .remember-row label {
    font-weight: 400;
    color: #374151;
    font-size: 0.9rem;
    cursor: pointer;
  }

  .btn-submit {
    width: 100%;
    background-color: #0f5c3f;
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 14px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background-color 0.15s ease;
  }

  .btn-submit:hover {
    background-color: #0c4a33;
  }

  .btn-submit svg {
    width: 18px;
    height: 18px;
  }

  .divider {
    border: none;
    border-top: 1px solid #e5e7eb;
    margin: 24px 0 20px;
  }

  .help-text {
    text-align: center;
    font-size: 0.9rem;
    color: #6b7280;
  }

  .help-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #0f7a4e;
    font-weight: 600;
    text-decoration: none;
    margin-top: 4px;
  }

  .help-link:hover {
    text-decoration: underline;
  }

  .help-link svg {
    width: 16px;
    height: 16px;
  }
</style>
</head>
<body>

  <div class="login-wrapper">
    <div class="logo-icon">
      <!-- ikon daun -->
      <svg viewBox="0 0 24 24">
        <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
      </svg>
    </div>

    <h1 class="brand">EcoTrack</h1>
    <p class="tagline">Manajemen keberlanjutan dan efisiensi limbah terpadu</p>

    <div class="login-card">
      <form id="loginForm">
        <div class="field">
          <div class="field-header">
            <label for="username">Username atau NIP</label>
          </div>
          <div class="input-group" id="usernameGroup">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" id="username" name="username" placeholder="Masukkan username (masyarakat) atau NIP (petugas/dinas)" required>
          </div>
          <div class="error-text" id="errorText">ID tidak ditemukan. Periksa kembali username atau NIP Anda.</div>
        </div>

        <div class="field">
          <div class="field-header">
            <label for="password">Kata Sandi</label>
            <a href="#" class="forgot-link">Lupa Password?</a>
          </div>
          <div class="input-group">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
          </div>
        </div>

        <div class="remember-row">
          <input type="checkbox" id="remember" name="remember">
          <label for="remember">Ingat Saya</label>
        </div>

        <button type="submit" class="btn-submit">
          Masuk Ke Aplikasi
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <path d="M10 17l5-5-5-5"/>
            <path d="M15 12H3"/>
          </svg>
        </button>

        <hr class="divider">

        <div class="help-text">
          Butuh bantuan akses?<br>
          <a href="#" class="help-link">
            Hubungi Admin Sistem
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18.36 12A6.36 6.36 0 1 1 12 5.64"/>
              <path d="M9 9h.01M15 9h.01"/>
              <path d="M9 15c.83.67 1.9 1 3 1s2.17-.33 3-1"/>
            </svg>
          </a>
        </div>
      </form>
    </div>
  </div>

  <script>
    // "Database" contoh akun untuk simulasi deteksi peran otomatis.
    // Di aplikasi nyata, pengecekan ini dilakukan oleh backend saat proses autentikasi.
    const petugasNIP = ['19870512001', '19900823002', '19921107003', '19880314004', '19950602005', '19850119006'];
    const dinasNIP = ['19700315001'];
    const masyarakatAccounts = ['budisantoso', 'budi.santoso@gmail.com', 'sitirahayu'];

    const usernameInput = document.getElementById('username');
    const usernameGroup = document.getElementById('usernameGroup');
    const errorText = document.getElementById('errorText');

    function detectRole(idValue) {
      const value = idValue.trim().toLowerCase();
      if (petugasNIP.includes(value)) return 'petugas';
      if (dinasNIP.includes(value)) return 'dinas';
      if (masyarakatAccounts.includes(value)) return 'masyarakat';

      // Fallback: NIP biasanya berupa angka. Kalau belum terdaftar di daftar contoh
      // tapi formatnya angka panjang, anggap petugas. Selain itu anggap akun masyarakat
      // (username/email bebas), supaya masyarakat tetap bisa login tanpa akun contoh di atas.
      if (/^\d{8,}$/.test(value)) return 'petugas';
      if (value.length > 0) return 'masyarakat';
      return null;
    }

    const roleRedirect = {
      masyarakat: 'dashboard-ecotrack.html',
      petugas: 'portal-petugas-ecotrack.html',
      dinas: 'admin-dashboard-ecotrack.html'
    };

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const role = detectRole(usernameInput.value);

      if (!role) {
        usernameGroup.classList.add('error');
        errorText.style.display = 'block';
        return;
      }

      usernameGroup.classList.remove('error');
      errorText.style.display = 'none';

      // Sistem otomatis mengenali peran dari ID yang dimasukkan lalu
      // mengarahkan langsung ke dashboard yang sesuai — tanpa perlu memilih peran manual.
      window.location.href = roleRedirect[role];
    });
  </script>

</body>
</html>
